[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepseek-skill-doctor"
version = "0.1.0"
description = "DeepSeek and DSH compatibility checks for Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DeepSeek Skill Doctor contributors" }]
keywords = ["agent-skills", "deepseek", "dsh", "lint", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref",
]

[project.urls]
Homepage = "https://github.com/Whning0513/deepseek-skill-doctor"
Issues = "https://github.com/Whning0513/deepseek-skill-doctor/issues"

[project.scripts]
dsskill-doctor = "deepseek_skill_doctor.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.14",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_skill_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

